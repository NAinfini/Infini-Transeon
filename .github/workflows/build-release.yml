name: build-release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to release (for example, v1.0.0)
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: none

jobs:
  release:
    name: Verify, package, and publish unsigned
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate immutable release tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag '$env:RELEASE_TAG' is not a stable semantic version."
          }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) {
            throw "Release tag '$env:RELEASE_TAG' does not identify the checked-out commit."
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Require release-manifest signing inputs
        env:
          RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          RELEASE_ED25519_KEY_ID: ${{ secrets.RELEASE_ED25519_KEY_ID }}
        run: |
          $required = @(
            'RELEASE_ED25519_PRIVATE_KEY',
            'RELEASE_ED25519_KEY_ID'
          )
          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace(
                    [Environment]::GetEnvironmentVariable($name))) {
              throw "Release secret '$name' is required."
            }
          }
          if ($env:RELEASE_ED25519_KEY_ID -ne 'release-2026-a') {
            throw 'RELEASE_ED25519_KEY_ID does not match the public key embedded in this build.'
          }

      - name: Restore
        run: |
          dotnet restore InfiniTranseon.sln
          dotnet restore src/InfiniTranseon.App/InfiniTranseon.App.csproj -r win-x64
          dotnet restore src/InfiniTranseon.ModelWorker/InfiniTranseon.ModelWorker.csproj -r win-x64
          dotnet restore src/InfiniTranseon.Engine.Native/dependencies/InfiniTranseon.Engine.Native.Dependencies.csproj

      - name: Native release tests
        run: |
          cmake --preset windows-x64 -DINFINI_ENABLE_LOCAL_MODEL_RUNTIME=ON
          cmake --build --preset windows-x64-release
          ctest --test-dir artifacts/cmake/windows-x64 -C Release --output-on-failure

      - name: Managed release tests
        run: dotnet test InfiniTranseon.sln -c Release --no-restore

      - name: Benchmark contract smoke
        run: dotnet run --project benchmarks/GameOcrBench/GameOcrBench.csproj -c Release --no-build -- benchmarks/GameOcrBench/smoke-samples.json artifacts/game-ocr-bench-smoke.json

      - name: Publish Windows processes
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          dotnet publish src/InfiniTranseon.App/InfiniTranseon.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Version=$version -o artifacts/release/publish
          dotnet publish src/InfiniTranseon.ModelWorker/InfiniTranseon.ModelWorker.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Version=$version -p:PublishSingleFile=true -o artifacts/release/model-worker
          Copy-Item artifacts/release/model-worker/InfiniTranseon.ModelWorker.exe artifacts/release/publish/
          Copy-Item artifacts/cmake/windows-x64/src/InfiniTranseon.EngineHost/Release/InfiniTranseon.EngineHost.exe artifacts/release/publish/
          Copy-Item artifacts/cmake/windows-x64/src/InfiniTranseon.ModelRuntime.Native/Release/InfiniTranseon.ModelRuntime.Native.dll artifacts/release/publish/
          Copy-Item LICENSE,NOTICE artifacts/release/publish/
          Copy-Item packaging/portable-manifest.json artifacts/release/publish/
          $licenseRoot = 'artifacts/release/publish/licenses/native'
          New-Item -ItemType Directory -Force -Path $licenseRoot | Out-Null
          Copy-Item artifacts/cmake/windows-x64/_deps/ctranslate2-src/LICENSE "$licenseRoot/CTranslate2-MIT.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/ctranslate2-src/third_party/cpu_features/LICENSE "$licenseRoot/cpu_features-Apache-2.0.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/ctranslate2-src/third_party/ruy/LICENSE "$licenseRoot/ruy-Apache-2.0.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/ctranslate2-src/third_party/spdlog/LICENSE "$licenseRoot/spdlog-MIT.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/sentencepiece-src/LICENSE "$licenseRoot/SentencePiece-Apache-2.0.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/sentencepiece-src/third_party/absl/LICENSE "$licenseRoot/abseil-Apache-2.0.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/sentencepiece-src/third_party/darts_clone/LICENSE "$licenseRoot/darts-clone-BSD-3-Clause.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/sentencepiece-src/third_party/esaxx/LICENSE "$licenseRoot/esaxx-MIT.txt"
          Copy-Item artifacts/cmake/windows-x64/_deps/sentencepiece-src/third_party/protobuf-lite/LICENSE "$licenseRoot/protobuf-lite-BSD-3-Clause.txt"
          Get-ChildItem -LiteralPath artifacts/release/publish -Recurse -Filter *.pdb |
            Remove-Item -Force
          ./scripts/verify-native-runtime-dependencies.ps1 -BinaryPath @(
            'artifacts/release/publish/InfiniTranseon.App.exe',
            'artifacts/release/publish/InfiniTranseon.EngineHost.exe',
            'artifacts/release/publish/InfiniTranseon.ModelWorker.exe',
            'artifacts/release/publish/InfiniTranseon.ModelRuntime.Native.dll'
          )
          ./scripts/verify-native-dpi-manifests.ps1 -BinaryPath @(
            'artifacts/release/publish/InfiniTranseon.EngineHost.exe'
          )

      - name: Build signed model catalog
        env:
          RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          RELEASE_ED25519_KEY_ID: ${{ secrets.RELEASE_ED25519_KEY_ID }}
        run: |
          ./scripts/build-signed-model-catalog.ps1 `
            -TemplatePath packaging/model-catalog.template.json `
            -OutputPath artifacts/release/publish/model-catalog.json `
            -CatalogSequence $env:GITHUB_RUN_NUMBER
          ./scripts/verify-release-signing-key.ps1 `
            -ManifestPath artifacts/release/publish/model-catalog.json

      - name: Generate and verify SBOM
        run: |
          dotnet tool restore
          dotnet tool run dotnet-CycloneDX InfiniTranseon.sln -o artifacts/release/publish -fn sbom.json -F Json -dpr
          ./scripts/verify-sbom-licenses.ps1 `
            -BomPath artifacts/release/publish/sbom.json `
            -ModelCatalogPath artifacts/release/publish/model-catalog.json `
            -NativeNoticesPath packaging/native-third-party-notices.json `
            -NoticesOutputPath artifacts/release/publish/THIRD-PARTY-NOTICES.json
          ./scripts/verify-portable-layout.ps1 -PublishDirectory artifacts/release/publish

      - name: Build installer and portable archives
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = $env:RELEASE_TAG.TrimStart('v')
          wix build packaging/installer.wxs -arch x64 -d Version=$version -d PublishDir=$((Resolve-Path artifacts/release/publish).Path) -o artifacts/release/Infini-Transeon.msi
          wix msi validate artifacts/release/Infini-Transeon.msi
          ./scripts/verify-msi-layout.ps1 `
            -MsiPath artifacts/release/Infini-Transeon.msi
          Compress-Archive -Path artifacts/release/publish/* -DestinationPath artifacts/release/Infini-Transeon-portable.zip
          git archive --format=zip --output=artifacts/release/Infini-Transeon-source.zip $env:RELEASE_TAG

      - name: Verify declared unsigned Windows artifacts
        run: |
          $artifacts = @(
            'artifacts/release/publish/InfiniTranseon.App.exe',
            'artifacts/release/publish/InfiniTranseon.EngineHost.exe',
            'artifacts/release/publish/InfiniTranseon.ModelWorker.exe',
            'artifacts/release/publish/InfiniTranseon.ModelRuntime.Native.dll',
            'artifacts/release/Infini-Transeon.msi'
          )
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
              throw "Artifact '$artifact' must be unsigned, but its signature status is '$($signature.Status)'."
            }
          }

      - name: Sign and verify canonical release manifest
        env:
          RELEASE_ED25519_PRIVATE_KEY: ${{ secrets.RELEASE_ED25519_PRIVATE_KEY }}
          RELEASE_ED25519_KEY_ID: ${{ secrets.RELEASE_ED25519_KEY_ID }}
        run: |
          ./scripts/build-signed-release.ps1 `
            -ReleaseDirectory artifacts/release `
            -Version $env:RELEASE_TAG `
            -ReleaseSequence $env:GITHUB_RUN_NUMBER
          ./scripts/verify-release-signing-key.ps1 `
            -ManifestPath artifacts/release/release-manifest.json

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $warning = @'
          > [!WARNING]
          > **Unsigned Windows build:** the MSI and application binaries do not have an Authenticode signature. Windows will show **Unknown publisher** and SmartScreen may warn. The application updater verifies the Ed25519-signed release manifest, artifact size, and SHA-256 hash before offering the MSI.
          '@
          $assets = @(
            'artifacts/release/Infini-Transeon.msi',
            'artifacts/release/Infini-Transeon-portable.zip',
            'artifacts/release/Infini-Transeon-source.zip',
            'artifacts/release/release-manifest.json',
            'artifacts/release/publish/sbom.json',
            'artifacts/release/publish/THIRD-PARTY-NOTICES.json'
          )
          $draft = & gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') {
              throw "Published release '$env:RELEASE_TAG' already exists and will not be modified."
            }
            & gh release upload $env:RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not upload assets to draft release '$env:RELEASE_TAG'."
            }
            $body = & gh release view $env:RELEASE_TAG --json body --jq '.body'
            if ($body -notlike '*Unsigned Windows build*') {
              & gh release edit $env:RELEASE_TAG --notes "$warning`n`n$body"
              if ($LASTEXITCODE -ne 0) {
                throw "Could not add the unsigned-build warning to '$env:RELEASE_TAG'."
              }
            }
          }
          else {
            & gh release create $env:RELEASE_TAG @assets `
              --verify-tag `
              --draft `
              --generate-notes `
              --notes $warning `
              --title "Infini-Transeon $env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not stage GitHub Release '$env:RELEASE_TAG'."
          }
          & gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish GitHub Release '$env:RELEASE_TAG'."
          }
