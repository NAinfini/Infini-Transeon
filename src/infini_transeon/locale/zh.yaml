local.madlad.title: "MADLAD-400 — 本地翻译模型"
local.madlad.hint: "一个 CTranslate2 多语言模型，覆盖 450 多种语言（Apache-2.0）。可用 GPU 时自动以 int8_float16 加速，否则退回 CPU。3B 为默认版本，显存 4 GB 即可；7B 质量更高，需约 8 GB 显存。"
