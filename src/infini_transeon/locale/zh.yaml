local.madlad.beam_size.hint: "越大质量越好，速度越慢。5 为 MADLAD 论文推荐值。CPU 上可降到 1–2 以换取更快的解码速度，代价是质量下降。"
local.madlad.max_decoding_length.label: "最大解码长度"
local.madlad.max_decoding_length.hint: "每行输出的最大 token 数。192 足以覆盖大多数 UI 与对话；长段落可调高，若输出经常被过早截断可相应调整。"
