settings.translation.fallback_to_local.hint: "断网或额度耗尽时保持可用。关闭后在线失败将作为错误上报，不再静默降级。"
settings.translation.last_resort_mymemory.label: "允许 MyMemory（免费、无需密钥）作为最终兜底"
settings.translation.last_resort_mymemory.hint: "仅在主在线服务与本地翻译器都不可用时使用。会将源文本发送到第三方服务——介意请关闭。"
settings.translation.cache_size.label: "翻译记忆容量"
settings.translation.cache_size.hint: "内存中保留的「源文→译文」条目数。值越大，静态画面下复用率越高，内存占用也更多。"
settings.translation.ui_language: "界面语言"
settings.translation.ui_language.hint: "更改 Infini-Transeon 界面本身的语言。重启后完全生效。"
settings.theme.label: "主题"
settings.theme.auto: "跟随系统"
settings.theme.light: "浅色"
settings.theme.dark: "深色"
settings.theme.hint: "「跟随系统」会自动跟随操作系统的浅色/深色设置。"
settings.capture.trigger.label: "触发模式"
settings.capture.trigger.continuous: "连续（按定时器运行）"
settings.capture.trigger.manual: "手动（仅在按钮 / 快捷键时）"
settings.capture.trigger.hint: "手动模式会停止 OCR 循环，只有每次按下「立即翻译」时才运行一次。"
settings.capture.interval.label: "OCR 间隔"
settings.capture.interval.hint: "连续运行时两次 OCR 之间的秒数。越短更新越快，CPU 占用也越高。"
settings.ocr.det_max_side.label: "OCR 检测输入尺寸"
settings.ocr.det_max_side.hint: "OCR 检测器看到的最长边（物理像素）。值越小越快；值越大越能看清小字。1280 很快但在 4K 下会把小字糊掉。3840 保留 4K 原始分辨率。GPU 能轻松处理 3840；纯 CPU 用户建议 1280–1920。"
settings.ocr.det_tier.label: "OCR 检测器模型"
settings.ocr.det_tier.hint: "“服务器版”使用高精度 PP-OCRv5 检测器——对小字和复杂 UI 的召回率明显更好，代价是多约 100–300 MB 显存，GPU 每帧多 100–200 ms。“移动版”在 CPU 上快约 5 倍，但对密集 UI 和小字识别较差。有 GPU 时建议选“服务器版”。"
settings.ocr.det_tier.mobile: "移动版（快，适合 CPU）"
settings.ocr.det_tier.server: "服务器版（精准，推荐 GPU）"
settings.ocr.min_confidence.label: "OCR 最小置信度"
settings.ocr.min_confidence.hint: "低于该分数的检测结果在送往翻译器前会被丢弃。调高可抑制噪声，调低可捕获更多小字或艺术字。干净正文一般 0.5 以上即可；游戏 UI 与字幕通常需要 0.3–0.4。"
settings.ocr.postcorrect_min_confidence.label: "纠错最小置信度"
settings.ocr.postcorrect_min_confidence.hint: "仅对高于该分数的检测结果做拼写纠错。对低置信度 OCR 做纠错往往会“编造”看似合理但错误的词。"
settings.ocr.enable_postcorrect.label: "启用拼写纠错"
settings.ocr.enable_postcorrect.hint: "在翻译前，对高置信度检测结果运行基于词典的拼写检查。"
settings.ocr.enable_preprocess.label: "启用图像预处理"
settings.ocr.enable_preprocess.hint: "OCR 前执行 CLAHE 对比度增强 + 去噪 + 智能放大。对小号 UI 文本质量提升明显，运行时开销极小。"
settings.ocr.advanced.title: "高级"
settings.overlay.label: "叠加层"
settings.overlay.click_through: "叠加层穿透点击（将点击传给下方窗口）"
settings.overlay.click_through.tip: "推荐保持开启。仅在需要与翻译气泡交互时关闭。"
settings.btn.ok: "确定"
settings.btn.cancel: "取消"

