settings.capture.trigger.label: "Режим триггера"
settings.capture.trigger.continuous: "Непрерывно (по таймеру)"
settings.capture.trigger.manual: "Вручную (только по кнопке / горячей клавише)"
settings.capture.trigger.hint: "Ручной режим останавливает цикл OCR и выполняет один проход при каждом нажатии «Перевести сейчас»."
settings.capture.interval.label: "Интервал OCR"
settings.capture.interval.hint: "Секунды между проходами OCR в непрерывном режиме. Меньше = быстрее обновления и выше нагрузка на CPU."
settings.ocr.det_max_side.label: "Размер входа детектора OCR"
settings.ocr.det_max_side.hint: "Длина длинной стороны, которую видит детектор OCR (в физических пикселях). Меньше — быстрее; больше — мелкий текст читается лучше. 1280 быстро, но мелкие глифы на 4K превращаются в кашу. 3840 сохраняет исходное 4K. GPU без проблем тянет 3840; для CPU лучше 1280–1920."
settings.ocr.det_tier.label: "Модель детектора OCR"
settings.ocr.det_tier.hint: "«Серверная» использует высокоточный детектор PP-OCRv5 — заметно лучше распознаёт мелкий текст и перегруженный UI, ценой ~100-300 МБ дополнительной VRAM и +100-200 мс на кадр при GPU. «Мобильная» на CPU примерно в 5 раз быстрее, но хуже работает с плотным UI и мелкими шрифтами. С GPU выбирайте «серверную»."
settings.ocr.det_tier.mobile: "Мобильная (быстро, для CPU)"
settings.ocr.det_tier.server: "Серверная (точно, нужна GPU)"
settings.ocr.min_confidence.label: "Минимальная уверенность OCR"
settings.ocr.min_confidence.hint: "Отбрасывает распознавания с баллом ниже этого порога до передачи в переводчик. Выше — меньше шума; ниже — лучше ловятся мелкий и стилизованный текст. Для чистой прозы хватает 0,5+; для игрового UI и субтитров часто нужно 0,3–0,4."
settings.ocr.postcorrect_min_confidence.label: "Минимальная уверенность для коррекции"
settings.ocr.postcorrect_min_confidence.hint: "Применяет исправление опечаток только к распознаваниям выше этого порога. Исправление OCR с низкой уверенностью склонно «додумывать» правдоподобные, но неверные слова."
settings.ocr.enable_postcorrect.label: "Включить исправление опечаток"
settings.ocr.enable_postcorrect.hint: "Перед переводом выполняет словарную проверку орфографии на высокоуверенных распознаваниях."
settings.ocr.enable_preprocess.label: "Включить предобработку изображения"
settings.ocr.enable_preprocess.hint: "Перед OCR: повышение контраста CLAHE + шумоподавление + умное увеличение. Заметный прирост качества на мелком тексте UI при минимальных затратах времени."
settings.overlay.label: "Оверлей"
settings.overlay.click_through: "Клики проходят сквозь оверлей (в окно под ним)"
settings.overlay.click_through.tip: "Рекомендуется. Отключайте только при взаимодействии с пузырями."
settings.btn.ok: "ОК"
settings.btn.cancel: "Отмена"

