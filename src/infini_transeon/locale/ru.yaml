wiz.title: "Добро пожаловать в Infini-Transeon"
wiz.subtitle: "Переводит любой текст на экране в реальном времени. Выберите режим для начала — все настройки можно изменить позже."
wiz.mode.title: "Режим перевода"
wiz.mode.online: "Онлайн — любой LLM API (лучшее качество)"
wiz.mode.online.hint: "OpenAI, Claude, Gemini, OpenRouter, DeepSeek и любые OpenAI-совместимые эндпоинты. Base URL, Model, API Key вы указываете сами."
wiz.mode.local: "Локально — офлайн (Opus-MT по языковой паре, опционально — многоязычное обновление до MADLAD-400)"
wiz.mode.local.hint: "Полностью офлайн. Opus-MT загружается по языковым парам по мере необходимости. Позже можно включить MADLAD-400 7B (~8 ГБ, Apache-2) для единой многоязычной модели."
wiz.lang.title: "Язык перевода по умолчанию"
wiz.lang.hint: "На этом языке будут отображаться переводы. Изменить в Настройки → Перевод."
