local.madlad.max_decoding_length.label: "Longitud máxima de decodificación"
local.madlad.max_decoding_length.hint: "Máximo de tokens por línea de salida. 192 cubre la mayoría de UIs y diálogos; súbelo para párrafos largos o ajústalo si las salidas quedan cortadas antes de tiempo."
local.madlad.max_batch_size.label: "Tamaño máximo de lote"
local.madlad.max_batch_size.hint: "Párrafos por lote de GPU. Mayor = mejor uso de la GPU y más VRAM. 32 va bien en tarjetas de 12 GB; 8–16 en tarjetas de 6 GB."

