settings.capture.trigger.label: "Modo de activación"
settings.capture.trigger.continuous: "Continuo (ejecutar con temporizador)"
settings.capture.trigger.manual: "Manual (solo con botón / atajo)"
settings.capture.trigger.hint: "El modo manual detiene el bucle de OCR y solo ejecuta una pasada cada vez que pulsas Traducir ahora."
settings.capture.interval.label: "Intervalo de OCR"
settings.capture.interval.hint: "Segundos entre pasadas de OCR durante la ejecución continua. Más corto = actualizaciones más rápidas y más CPU."
settings.ocr.det_max_side.label: "Tamaño de entrada del detector OCR"
settings.ocr.det_max_side.hint: "Lado más largo que ve el detector OCR, en píxeles físicos. Valores menores son más rápidos; mayores mantienen legible el texto pequeño. 1280 es rápido pero destruye los glifos pequeños en 4K. 3840 conserva la resolución 4K nativa. La GPU maneja 3840 con comodidad; para CPU conviene 1280–1920."
settings.ocr.det_tier.label: "Modelo del detector OCR"
settings.ocr.det_tier.hint: "«Servidor» usa el detector PP-OCRv5 de alta precisión: mucha mejor detección de texto pequeño o interfaces saturadas, al coste de ~100-300 MB extra de VRAM y +100-200 ms por cuadro en GPU. «Móvil» es ~5x más rápido en CPU pero falla con UIs densas y letras pequeñas. Elige «Servidor» si tienes GPU."
settings.ocr.det_tier.mobile: "Móvil (rápido, apto para CPU)"
settings.ocr.det_tier.server: "Servidor (preciso, GPU recomendada)"
settings.ocr.min_confidence.label: "Confianza mínima de OCR"
settings.ocr.min_confidence.hint: "Descarta las detecciones por debajo de esta puntuación antes de pasarlas al traductor. Súbela para reducir ruido; bájala para capturar más texto pequeño o estilizado. La prosa limpia tolera 0,5 o más; las UIs de juegos y los subtítulos suelen necesitar 0,3–0,4."
settings.ocr.postcorrect_min_confidence.label: "Confianza mínima para corrección"
settings.ocr.postcorrect_min_confidence.hint: "Aplica la corrección ortográfica solo a detecciones por encima de esta puntuación. Corregir OCR de baja confianza tiende a inventar palabras plausibles pero incorrectas."
settings.ocr.enable_postcorrect.label: "Activar corrección ortográfica"
settings.ocr.enable_postcorrect.hint: "Ejecuta una verificación ortográfica basada en diccionario sobre las detecciones de alta confianza antes de traducir."
settings.ocr.enable_preprocess.label: "Activar preprocesado de imagen"
settings.ocr.enable_preprocess.hint: "CLAHE para subir el contraste + reducción de ruido + escalado inteligente antes del OCR. Gran salto de calidad en texto de UI pequeño con un coste de ejecución mínimo."
settings.overlay.label: "Superposición"
