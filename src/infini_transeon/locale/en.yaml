local.madlad.title: "MADLAD-400 — local translation model"
local.madlad.hint: "One multilingual CTranslate2 model covering 450+ languages (Apache-2.0). Auto-uses your GPU with int8_float16 when available; falls back to CPU. 3B is the default and fits 4 GB+ GPUs. 7B is higher quality but needs ~8 GB VRAM."
local.madlad.variant.3b: "3B — default (fits 4 GB GPUs, ~3 GB download)"
local.madlad.variant.3b.tip: "Default variant. Good quality on all major pairs, fast on low-end GPUs."
local.madlad.variant.7b: "7B — higher quality (needs 8 GB VRAM, ~8 GB download)"
local.madlad.variant.7b.tip: "Higher quality especially on technical text. Auto-falls back to CPU if your GPU can't hold it."
local.madlad.btn.download: "Download selected variant"
local.madlad.btn.download.tip: "Fetch the selected MADLAD variant's CTranslate2 weights from HuggingFace."
local.madlad.downloading: "Starting download…"
local.madlad.progress: "Downloading · {done} / {total} GB"
local.madlad.installed: "Installed · {size}"
local.madlad.not_installed: "Not installed."
local.madlad.failed: "MADLAD download failed: {message}"
local.madlad.delete.tip: "Delete the selected MADLAD variant's files to free disk space."
local.madlad.delete.confirm: "Delete the selected MADLAD-400 variant from disk?"
local.madlad.quality.title: "Decode quality"
local.madlad.beam_size.label: "Beam size"
local.madlad.beam_size.hint: "Higher = better quality, slower. 5 is the MADLAD paper's recommended setting. Drop to 1–2 on CPU for faster decode at a quality cost."
local.madlad.max_decoding_length.label: "Max decoding length"
local.madlad.max_decoding_length.hint: "Maximum tokens per output line. 192 covers most UI and dialogue; raise for long paragraphs, lower if outputs keep getting cut off too early."
local.madlad.max_batch_size.label: "Max batch size"
local.madlad.max_batch_size.hint: "Paragraphs per GPU batch. Higher = better GPU utilisation, more VRAM. 32 suits 12 GB cards; drop to 8–16 on 6 GB cards."

