settings.translation.source: "Source language"
settings.translation.source.auto: "Auto-detect"
settings.translation.target: "Target language"
settings.translation.style: "Style"
settings.translation.fallback_to_local.label: "Fall back to local translator when the online provider fails"
settings.translation.fallback_to_local.hint: "Required for offline continuity. Turn off to surface online failures as errors instead of silently degrading."
settings.translation.last_resort_mymemory.label: "Allow MyMemory (free, no key) as last-resort fallback"
settings.translation.last_resort_mymemory.hint: "Used only when both the primary online provider and the local translator are unavailable. Sends source text to a third-party service — disable if that is a concern."
settings.translation.cache_size.label: "Translation memory size"
settings.translation.cache_size.hint: "Number of source→translation pairs kept in memory. Larger values reduce repeat provider calls on static screens but use more RAM."
settings.translation.ui_language: "Interface language"
settings.translation.ui_language.hint: "Changes the language of the Infini-Transeon UI itself. Restart to fully apply."
settings.theme.label: "Theme"
settings.theme.auto: "Follow system"
settings.theme.light: "Light"
settings.theme.dark: "Dark"
settings.theme.hint: "'Follow system' tracks your OS light/dark setting automatically."
settings.capture.interval.label: "Translate every"
settings.capture.interval.hint: "Seconds between OCR + translation passes. Shorter = faster updates, more CPU. If your translator is slower than this, overlapping passes are skipped rather than queued."
settings.ocr.det_max_side.label: "OCR detector input size"
settings.ocr.det_max_side.hint: "Longest side the OCR detector sees, in physical pixels. Smaller values run faster; larger values keep small text readable. 1280 is fast but destroys small glyphs on 4K. 3840 preserves native 4K. GPU handles 3840 comfortably; CPU users may prefer 1280–1920."
settings.ocr.det_tier.label: "OCR detector tier"
settings.ocr.det_tier.hint: "'Server' uses the high-accuracy PP-OCRv5 detector — much better recall on small or cluttered UI text, at the cost of ~100-300 MB extra VRAM and +100-200 ms per frame on GPU. 'Mobile' is ~5x faster on CPU but misses dense UIs and small fonts. Pick 'Server' when you have a GPU."
settings.ocr.det_tier.mobile: "Mobile (fast, CPU-friendly)"
settings.ocr.det_tier.server: "Server (accurate, GPU-recommended)"
settings.ocr.min_confidence.label: "OCR minimum confidence"
settings.ocr.min_confidence.hint: "Drop detections below this score before they reach the translator. Raise to suppress noise; lower to catch more small or stylised text. Clean prose tolerates 0.5+; game UI and subtitles often need 0.3–0.4."
settings.ocr.postcorrect_min_confidence.label: "Post-correction minimum confidence"
settings.ocr.postcorrect_min_confidence.hint: "Only apply typo correction to detections above this score. Correcting low-confidence OCR tends to invent plausible-but-wrong words."
settings.ocr.enable_postcorrect.label: "Enable typo correction"
settings.ocr.enable_postcorrect.hint: "Runs a dictionary-based spell-check on high-confidence detections before translation."
settings.ocr.enable_preprocess.label: "Enable image preprocessing"
settings.ocr.enable_preprocess.hint: "CLAHE contrast boost + denoise + smart upscale before OCR. Big quality lift on small UI text at a trivial runtime cost."
settings.ocr.advanced.title: "Advanced"
settings.overlay.label: "Overlay"
settings.overlay.click_through: "Click-through overlay (pass clicks to the window below)"
settings.overlay.click_through.tip: "Recommended. Turn off only if you need to interact with the translation bubbles."
settings.btn.ok: "OK"
settings.btn.cancel: "Cancel"

