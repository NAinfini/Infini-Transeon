wiz.mode.local: "Local — offline (MADLAD-400 multilingual, Apache-2)"
wiz.mode.local.hint: "Fully offline. Downloads MADLAD-400 3B (~3 GB) by default — one model covers all major languages. Auto-uses your GPU when available; falls back to CPU. Upgrade to 7B later in Settings if you have ~8 GB VRAM."
wiz.lang.title: "Default target language"
wiz.lang.hint: "This is the language translations will be shown in. Add or change it any time from Settings → Translation."
