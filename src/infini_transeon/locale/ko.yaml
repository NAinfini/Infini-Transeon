settings.capture.trigger.manual: "수동(버튼 / 단축키 입력 시에만)"
settings.capture.trigger.hint: "수동 모드는 OCR 루프를 멈추고, 「지금 번역」을 누를 때마다 한 번씩만 실행합니다."
settings.capture.interval.label: "OCR 간격"
settings.capture.interval.hint: "연속 실행 시 OCR 사이의 초 단위 간격. 짧을수록 업데이트가 빠르고 CPU 사용량이 늘어납니다."
settings.ocr.det_max_side.label: "OCR 감지 입력 크기"
settings.ocr.det_max_side.hint: "OCR 감지기가 처리하는 가장 긴 변(물리 픽셀). 값이 작을수록 빠르고, 클수록 작은 글자를 더 잘 읽습니다. 1280은 빠르지만 4K에서 작은 글자가 뭉개집니다. 3840은 4K 원본 해상도를 유지합니다. GPU는 3840도 여유롭게 처리하며, CPU 전용 환경에서는 1280–1920을 권장합니다."
settings.ocr.det_tier.label: "OCR 감지기 모델"
settings.ocr.det_tier.hint: "‘서버’는 고정밀 PP-OCRv5 감지기를 사용하여 작은 글자와 복잡한 UI의 인식률이 훨씬 좋아집니다. 대신 VRAM이 약 100–300 MB 더 필요하며 GPU에서 프레임당 +100–200 ms가 추가됩니다. ‘모바일’은 CPU에서 약 5배 빠르지만 밀집된 UI와 작은 글자에 약합니다. GPU가 있다면 ‘서버’를 권장합니다."
settings.ocr.det_tier.mobile: "모바일(빠름, CPU 친화적)"
settings.ocr.det_tier.server: "서버(정확, GPU 권장)"
settings.ocr.min_confidence.label: "OCR 최소 신뢰도"
settings.ocr.min_confidence.hint: "이 점수 미만의 감지 결과는 번역기로 보내기 전에 버립니다. 값을 높이면 노이즈가 줄고, 낮추면 작거나 스타일화된 글자를 더 많이 잡아냅니다. 깔끔한 본문은 0.5 이상으로 충분하지만, 게임 UI 와 자막은 보통 0.3–0.4 가 필요합니다."
settings.ocr.postcorrect_min_confidence.label: "오탈자 교정 최소 신뢰도"
settings.ocr.postcorrect_min_confidence.hint: "이 점수를 초과하는 감지에만 오탈자 교정을 적용합니다. 신뢰도가 낮은 OCR 을 교정하면 그럴듯하지만 잘못된 단어를 만들어내기 쉽습니다."
settings.ocr.enable_postcorrect.label: "오탈자 교정 사용"
settings.ocr.enable_postcorrect.hint: "번역 전에 신뢰도가 높은 감지 결과에 사전 기반 맞춤법 검사를 실행합니다."
settings.ocr.enable_preprocess.label: "이미지 전처리 사용"
settings.ocr.enable_preprocess.hint: "OCR 전에 CLAHE 대비 강화 + 노이즈 제거 + 스마트 업스케일을 수행합니다. 작은 UI 글자 품질이 크게 올라가며 런타임 비용은 매우 적습니다."
settings.overlay.label: "오버레이"
settings.overlay.click_through: "오버레이 클릭 통과(클릭을 아래 창으로 전달)"
settings.overlay.click_through.tip: "기본 권장. 번역 말풍선을 조작할 때만 끄세요."
settings.btn.ok: "확인"
settings.btn.cancel: "취소"

