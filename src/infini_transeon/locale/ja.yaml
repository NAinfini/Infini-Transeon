settings.capture.trigger.hint: "手動モードでは OCR ループを停止し、「今すぐ翻訳」を押した時のみ 1 回実行します。"
settings.capture.interval.label: "OCR 間隔"
settings.capture.interval.hint: "連続実行時の OCR の間隔（秒）。短いほど更新は速く、CPU 負荷も高くなります。"
settings.ocr.det_max_side.label: "OCR 検出入力サイズ"
settings.ocr.det_max_side.hint: "OCR 検出器が処理する最長辺（物理ピクセル）。小さいほど高速、大きいほど小さな文字も読み取れます。1280 は高速ですが 4K では小さい文字が潰れます。3840 で 4K 解像度をそのまま維持できます。GPU なら 3840 でも快適。CPU のみの環境では 1280〜1920 を推奨。"
settings.ocr.det_tier.label: "OCR 検出器モデル"
settings.ocr.det_tier.hint: "「サーバー版」は高精度な PP-OCRv5 検出器で、小さな文字や情報量の多い UI の検出精度が大きく向上します。代わりに VRAM を約 100〜300 MB 追加で消費し、GPU で 1 フレームあたり +100〜200 ms。「モバイル版」は CPU で約 5 倍速ですが、密な UI や小さい文字には弱いです。GPU がある場合は「サーバー版」推奨。"
settings.ocr.det_tier.mobile: "モバイル版（高速・CPU 向け）"
settings.ocr.det_tier.server: "サーバー版（高精度・GPU 推奨）"
settings.ocr.min_confidence.label: "OCR 最小信頼度"
settings.ocr.min_confidence.hint: "このスコアを下回る検出結果は翻訳に送る前に破棄します。値を上げるとノイズを抑えられ、下げると小さな文字や装飾文字も拾いやすくなります。整った本文は 0.5 以上でも問題なく、ゲーム UI や字幕では 0.3〜0.4 が必要になることが多いです。"
settings.ocr.postcorrect_min_confidence.label: "誤字訂正の最小信頼度"
settings.ocr.postcorrect_min_confidence.hint: "このスコアを超える検出のみ誤字訂正を適用します。信頼度の低い OCR を訂正すると、それらしいが誤った語を作り出しがちです。"
settings.ocr.enable_postcorrect.label: "誤字訂正を有効化"
settings.ocr.enable_postcorrect.hint: "翻訳前に、信頼度の高い検出結果へ辞書ベースのスペルチェックを実行します。"
settings.ocr.enable_preprocess.label: "画像前処理を有効化"
settings.ocr.enable_preprocess.hint: "OCR 前に CLAHE コントラスト強調 + ノイズ除去 + スマート拡大を実行。小さな UI 文字の品質が大きく向上し、実行コストはごくわずかです。"
settings.overlay.label: "オーバーレイ"
settings.overlay.click_through: "オーバーレイをクリックスルー（クリックは下のウィンドウへ）"
settings.overlay.click_through.tip: "通常は有効のまま。翻訳バブルを操作したいときだけ無効化。"
settings.btn.ok: "OK"
settings.btn.cancel: "キャンセル"

