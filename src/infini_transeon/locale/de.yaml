settings.capture.trigger.label: "Auslösemodus"
settings.capture.trigger.continuous: "Fortlaufend (per Timer)"
settings.capture.trigger.manual: "Manuell (nur per Knopf / Tastenkürzel)"
settings.capture.trigger.hint: "Im manuellen Modus läuft keine OCR-Schleife; jeder Druck auf „Jetzt übersetzen“ löst genau einen Durchlauf aus."
settings.capture.interval.label: "OCR-Intervall"
settings.capture.interval.hint: "Sekunden zwischen den OCR-Durchläufen im Dauerbetrieb. Kürzer = schnellere Updates, mehr CPU."
settings.ocr.det_max_side.label: "OCR-Detektor-Eingangsgröße"
settings.ocr.det_max_side.hint: "Längste Seite, die der OCR-Detektor sieht (physische Pixel). Kleiner = schneller; größer erhält kleine Schrift lesbar. 1280 ist schnell, zerstört aber kleine Glyphen bei 4K. 3840 erhält die native 4K-Auflösung. Eine GPU schafft 3840 problemlos; auf reinen CPU-Systemen eher 1280–1920."
settings.ocr.det_tier.label: "OCR-Detektormodell"
settings.ocr.det_tier.hint: "„Server“ verwendet den hochgenauen PP-OCRv5-Detektor — deutlich bessere Erkennung bei kleiner Schrift und überladenen UIs, kostet aber ~100-300 MB mehr VRAM und +100-200 ms pro Bild auf der GPU. „Mobile“ ist auf CPU ~5x schneller, versagt aber bei dichten UIs und kleinen Schriften. Mit GPU „Server“ wählen."
settings.ocr.det_tier.mobile: "Mobile (schnell, CPU-tauglich)"
settings.ocr.det_tier.server: "Server (präzise, GPU empfohlen)"
settings.ocr.min_confidence.label: "OCR-Mindestkonfidenz"
settings.ocr.min_confidence.hint: "Verwirft Erkennungen unterhalb dieses Werts, bevor sie an den Übersetzer gehen. Höher = weniger Rauschen; niedriger = fängt mehr kleine oder stilisierte Schrift. Saubere Fließtexte vertragen 0,5+; Spiel-UIs und Untertitel brauchen häufig 0,3–0,4."
settings.ocr.postcorrect_min_confidence.label: "Mindestkonfidenz für Rechtschreibkorrektur"
settings.ocr.postcorrect_min_confidence.hint: "Rechtschreibkorrektur nur oberhalb dieses Werts anwenden. Das Korrigieren unsicherer OCR-Treffer erfindet gern plausibel klingende, aber falsche Wörter."
settings.ocr.enable_postcorrect.label: "Rechtschreibkorrektur aktivieren"
settings.ocr.enable_postcorrect.hint: "Führt vor der Übersetzung eine wörterbuchbasierte Rechtschreibprüfung auf vertrauenswürdigen Erkennungen aus."
settings.ocr.enable_preprocess.label: "Bildvorverarbeitung aktivieren"
settings.ocr.enable_preprocess.hint: "Vor dem OCR: CLAHE-Kontrastanhebung + Entrauschen + intelligentes Upscaling. Deutlicher Qualitätsgewinn bei kleiner UI-Schrift bei kaum spürbarer Laufzeit."
settings.overlay.label: "Overlay"
settings.overlay.click_through: "Klicks durch Overlay reichen (gehen zum Fenster darunter)"
settings.overlay.click_through.tip: "Empfohlen. Nur deaktivieren, wenn du die Sprechblasen anklicken willst."
settings.btn.ok: "OK"
settings.btn.cancel: "Abbrechen"

