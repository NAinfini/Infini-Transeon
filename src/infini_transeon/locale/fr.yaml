settings.theme.hint: "« Suivre le système » adopte automatiquement le mode clair/sombre du système."
settings.capture.trigger.label: "Mode de déclenchement"
settings.capture.trigger.continuous: "Continu (sur minuteur)"
settings.capture.trigger.manual: "Manuel (uniquement via bouton / raccourci)"
settings.capture.trigger.hint: "Le mode manuel arrête la boucle OCR et ne lance qu'une passe à chaque appui sur Traduire maintenant."
settings.capture.interval.label: "Intervalle OCR"
settings.capture.interval.hint: "Secondes entre les passes OCR en mode continu. Plus court = mises à jour plus rapides, plus de CPU."
settings.ocr.det_max_side.label: "Taille d'entrée du détecteur OCR"
settings.ocr.det_max_side.hint: "Côté le plus long vu par le détecteur OCR, en pixels physiques. Plus petit = plus rapide ; plus grand conserve la lisibilité du texte fin. 1280 est rapide mais détruit les petits glyphes en 4K. 3840 préserve la résolution 4K native. Un GPU gère 3840 sans souci ; en CPU seul, 1280–1920 est préférable."
settings.ocr.det_tier.label: "Modèle du détecteur OCR"
settings.ocr.det_tier.hint: "« Serveur » utilise le détecteur PP-OCRv5 haute précision : bien meilleure détection du texte fin ou des UI denses, au prix de ~100-300 Mo de VRAM supplémentaires et +100-200 ms par image sur GPU. « Mobile » est ~5x plus rapide sur CPU mais rate les UI denses et les petites polices. Choisissez « Serveur » si vous avez un GPU."
settings.ocr.det_tier.mobile: "Mobile (rapide, adapté CPU)"
settings.ocr.det_tier.server: "Serveur (précis, GPU recommandé)"
settings.ocr.min_confidence.label: "Confiance OCR minimale"
settings.ocr.min_confidence.hint: "Supprime les détections sous ce score avant de les envoyer au traducteur. Augmentez pour réduire le bruit ; baissez pour récupérer plus de texte petit ou stylisé. Une prose propre tolère 0,5 et plus ; les UI de jeu et les sous-titres demandent souvent 0,3–0,4."
settings.ocr.postcorrect_min_confidence.label: "Confiance minimale pour la correction"
settings.ocr.postcorrect_min_confidence.hint: "N'applique la correction des fautes qu'aux détections au-dessus de ce score. Corriger une OCR peu fiable tend à inventer des mots plausibles mais faux."
settings.ocr.enable_postcorrect.label: "Activer la correction orthographique"
settings.ocr.enable_postcorrect.hint: "Exécute une vérification orthographique par dictionnaire sur les détections fiables avant la traduction."
settings.ocr.enable_preprocess.label: "Activer le prétraitement d'image"
settings.ocr.enable_preprocess.hint: "Avant l'OCR : rehaussement de contraste CLAHE + débruitage + agrandissement intelligent. Gros gain de qualité sur les petits textes d'UI, pour un coût d'exécution négligeable."
settings.overlay.label: "Superposition"
settings.overlay.click_through: "Clic traverse la superposition (va à la fenêtre en dessous)"
settings.overlay.click_through.tip: "Recommandé. Désactive uniquement si tu veux interagir avec les bulles."
settings.btn.ok: "OK"
settings.btn.cancel: "Annuler"

