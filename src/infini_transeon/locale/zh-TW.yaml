settings.theme.hint: "「跟隨系統」會自動跟隨作業系統的淺色／深色設定。"
settings.capture.trigger.label: "觸發模式"
settings.capture.trigger.continuous: "連續（依計時器執行）"
settings.capture.trigger.manual: "手動（僅在按鈕／快速鍵時）"
settings.capture.trigger.hint: "手動模式會停止 OCR 迴圈，僅在每次按下「立即翻譯」時執行一次。"
settings.capture.interval.label: "OCR 間隔"
settings.capture.interval.hint: "連續執行時兩次 OCR 之間的秒數。越短更新越快，CPU 占用也越高。"
settings.ocr.det_max_side.label: "OCR 偵測輸入尺寸"
settings.ocr.det_max_side.hint: "OCR 偵測器看到的最長邊（實體像素）。值越小越快；值越大越能看清小字。1280 很快但在 4K 下會把小字糊掉。3840 保留 4K 原生解析度。GPU 能輕鬆處理 3840；純 CPU 使用者建議 1280–1920。"
settings.ocr.det_tier.label: "OCR 偵測器模型"
settings.ocr.det_tier.hint: "「伺服器版」使用高精度 PP-OCRv5 偵測器——對小字與複雜 UI 的辨識率明顯更好，代價是多約 100–300 MB VRAM，GPU 每幀多 100–200 ms。「行動版」在 CPU 上快約 5 倍，但對密集 UI 與小字較弱。有 GPU 建議選「伺服器版」。"
settings.ocr.det_tier.mobile: "行動版（快，適合 CPU）"
settings.ocr.det_tier.server: "伺服器版（精準，建議 GPU）"
settings.ocr.min_confidence.label: "OCR 最小信心值"
settings.ocr.min_confidence.hint: "低於此分數的偵測結果在送往翻譯器前會被捨棄。調高可抑制雜訊；調低可抓到更多小字或藝術字。乾淨內文一般 0.5 以上即可；遊戲 UI 與字幕常需要 0.3–0.4。"
settings.ocr.postcorrect_min_confidence.label: "拼字校正最小信心值"
settings.ocr.postcorrect_min_confidence.hint: "僅對高於此分數的偵測結果套用拼字校正。對低信心度 OCR 校正常會「杜撰」看似合理但錯誤的詞。"
settings.ocr.enable_postcorrect.label: "啟用拼字校正"
settings.ocr.enable_postcorrect.hint: "翻譯前針對高信心度偵測結果執行以詞典為基礎的拼字檢查。"
settings.ocr.enable_preprocess.label: "啟用影像前處理"
settings.ocr.enable_preprocess.hint: "OCR 前執行 CLAHE 對比強化 + 去噪 + 智慧放大。對小號 UI 文字品質提升顯著，執行開銷極小。"
settings.overlay.label: "疊加層"
settings.overlay.click_through: "疊加層穿透點擊（將點擊傳給下方視窗）"
settings.overlay.click_through.tip: "建議保持開啟。僅在需要與翻譯氣泡互動時關閉。"
settings.btn.ok: "確定"
settings.btn.cancel: "取消"

