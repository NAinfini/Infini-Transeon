wiz.mode.local.hint: "完全離線。Opus-MT 依語種對按需下載。之後可啟用 MADLAD-400 7B（約 8 GB，Apache-2），取得單一的多語言模型。"
wiz.lang.title: "預設目標語言"
wiz.lang.hint: "翻譯結果將以此語言顯示。可隨時於「設定 → 翻譯」中修改。"
