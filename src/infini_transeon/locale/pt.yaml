local.madlad.quality.title: "Qualidade de decodificação"
local.madlad.beam_size.label: "Tamanho do beam"
local.madlad.beam_size.hint: "Maior = melhor qualidade, mais lento. 5 é o valor recomendado pelo artigo do MADLAD. Reduza para 1–2 em CPU para decodificar mais rápido, ao custo de qualidade."
local.madlad.max_decoding_length.label: "Comprimento máx. de decodificação"
local.madlad.max_decoding_length.hint: "Máximo de tokens por linha de saída. 192 cobre a maioria das UIs e diálogos; aumente para parágrafos longos, diminua se as saídas estiverem sendo cortadas cedo demais."
local.madlad.max_batch_size.label: "Tamanho máx. do lote"
local.madlad.max_batch_size.hint: "Parágrafos por lote de GPU. Maior = melhor utilização da GPU, mais VRAM. 32 serve para placas de 12 GB; 8–16 em placas de 6 GB."

