settings.capture.trigger.label: "Modo de acionamento"
settings.capture.trigger.continuous: "Contínuo (executar por temporizador)"
settings.capture.trigger.manual: "Manual (apenas via botão / atalho)"
settings.capture.trigger.hint: "O modo manual interrompe o loop de OCR e executa apenas uma passada cada vez que você pressiona Traduzir agora."
settings.capture.interval.label: "Intervalo de OCR"
settings.capture.interval.hint: "Segundos entre as passadas de OCR em execução contínua. Mais curto = atualizações mais rápidas e mais CPU."
settings.ocr.det_max_side.label: "Tamanho de entrada do detector de OCR"
settings.ocr.det_max_side.hint: "Maior lado que o detector de OCR enxerga, em pixels físicos. Valores menores são mais rápidos; maiores mantêm o texto pequeno legível. 1280 é rápido, mas destrói glifos pequenos em 4K. 3840 preserva a resolução 4K nativa. A GPU lida com 3840 sem esforço; em CPU, prefira 1280–1920."
settings.ocr.det_tier.label: "Modelo do detector de OCR"
settings.ocr.det_tier.hint: "«Servidor» usa o detector PP-OCRv5 de alta precisão — bem melhor na detecção de texto pequeno e UIs densas, ao custo de ~100-300 MB a mais de VRAM e +100-200 ms por quadro na GPU. «Móvel» é ~5x mais rápido na CPU, mas falha em UIs densas e fontes pequenas. Escolha «Servidor» se tiver GPU."
settings.ocr.det_tier.mobile: "Móvel (rápido, amigável à CPU)"
settings.ocr.det_tier.server: "Servidor (preciso, GPU recomendada)"
settings.ocr.min_confidence.label: "Confiança mínima do OCR"
settings.ocr.min_confidence.hint: "Descarta detecções abaixo desta pontuação antes de chegarem ao tradutor. Aumente para suprimir ruído; diminua para capturar mais texto pequeno ou estilizado. Prosa limpa tolera 0,5+; UIs de jogos e legendas costumam exigir 0,3–0,4."
settings.ocr.postcorrect_min_confidence.label: "Confiança mínima para correção"
settings.ocr.postcorrect_min_confidence.hint: "Aplica correção de erros de digitação apenas a detecções acima desta pontuação. Corrigir OCR de baixa confiança tende a inventar palavras plausíveis, mas erradas."
settings.ocr.enable_postcorrect.label: "Ativar correção ortográfica"
settings.ocr.enable_postcorrect.hint: "Executa uma verificação ortográfica baseada em dicionário sobre detecções de alta confiança antes da tradução."
settings.ocr.enable_preprocess.label: "Ativar pré-processamento de imagem"
settings.ocr.enable_preprocess.hint: "Antes do OCR: realce de contraste CLAHE + redução de ruído + upscale inteligente. Ganho significativo de qualidade em textos pequenos de UI, com custo de execução insignificante."
settings.overlay.label: "Sobreposição"
settings.overlay.click_through: "Cliques atravessam a sobreposição (vão para a janela abaixo)"
settings.overlay.click_through.tip: "Recomendado. Desative apenas se precisar interagir com as bolhas."
settings.btn.ok: "OK"
settings.btn.cancel: "Cancelar"

