# Language registry for Infini-Transeon. Extend this file to add languages;
# no code changes are needed unless the language requires a new OCR model.

languages:
  - code: en
    display: English
    paddle_code: en
    flores_code: eng_Latn
    script: Latn

  - code: zh
    display: 简体中文 (Chinese Simplified)
    paddle_code: ch
    flores_code: zho_Hans
    script: Hans

  - code: zh-TW
    display: 繁體中文 (Chinese Traditional)
    paddle_code: chinese_cht
    flores_code: zho_Hant
    script: Hant

  - code: ja
    display: 日本語 (Japanese)
    paddle_code: japan
    flores_code: jpn_Jpan
    script: Jpan

  - code: ko
    display: 한국어 (Korean)
    paddle_code: korean
    flores_code: kor_Hang
    script: Hang

  - code: es
    display: Español (Spanish)
    paddle_code: es
    flores_code: spa_Latn
    script: Latn

  - code: fr
    display: Français (French)
    paddle_code: fr
    flores_code: fra_Latn
    script: Latn

  - code: de
    display: Deutsch (German)
    paddle_code: german
    flores_code: deu_Latn
    script: Latn

  - code: ru
    display: Русский (Russian)
    paddle_code: ru
    flores_code: rus_Cyrl
    script: Cyrl

  - code: pt
    display: Português (Portuguese)
    paddle_code: pt
    flores_code: por_Latn
    script: Latn
